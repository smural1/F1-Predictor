<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Simulator</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        
        .container {
            background-color: #303030;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 600px;
        }

        .title {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #E10600;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            color: #555;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .season-button {
            background-color: #E10600;
            color: white;
            font-size: 1.1rem;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 200px;
            margin: 0 auto;
        }

        .season-button:hover {
            background-color: #cc0000;
        }

        .season-button:active {
            background-color: #a30000;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">F1 Simulator</div>
        <p>Select a season to simulate:</p>
        <div class="button-container">
            <button class="season-button" onclick="location.href='2025.html'">2025 Season</button>
            <button class="season-button" onclick="location.href='2024.html'">2024 Season</button>
            <button class="season-button" onclick="location.href='2023.html'">2023 Season</button>
            <button class="season-button" onclick="location.href='2022.html'">2022 Season</button>
        </div>
    </div>
</body>
</html>
